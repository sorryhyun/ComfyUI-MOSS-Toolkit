[project]
name = "comfyui-moss-toolkit"
description = "MOSS-Image nodes: a DiT + text encoder (bf16, INT8 W8A8 or fp8) + VAE loader, an fp32 residual stream patch, a MOSS LoRA loader with INT8 bypass, image-to-image (a VAE reference patch that loads the i2i LoRA, and a vision-tower text encode), and a caption helper with the prompt each MOSS LoRA trained on."
version = "0.15.0"
license = { file = "LICENSE" }
# torch / numpy / pillow ship with any ComfyUI install; listed for a bare `pip install .`.
dependencies = [
    "torch",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# The Caption Helper only (also in requirements.txt, which ComfyUI Manager installs);
# the i2i nodes load without it.
layout = ["anime-tools[ocr] @ git+https://github.com/sorryhyun/anime_tools@v0.16.0"]

[project.urls]
Repository = "https://github.com/sorryhyun/ComfyUI-MOSS-Toolkit"

[tool.comfy]
PublisherId = "sorryhyun"
DisplayName = "MOSS Toolkit"
Icon = ""
