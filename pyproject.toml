[project]
name = "comfyui-moss-toolkit"
description = "MOSS-Image toolkit: a one-node DiT + text encoder (bf16, INT8 W8A8 or fp8) + VAE loader, image-to-image (a text encode that puts the page through Qwen3.5's vision tower, and a MODEL patch that loads the i2i LoRA and feeds the page as a clean VAE reference latent on RoPE's reserved r axis, isolated for colorize v3), an Anima caption -> MOSS layout-JSON prompt node, and a caption helper with the prompt each i2i LoRA trained on (colorize with the page's OCR lines, sanitize's fixed caption). Works under KSampler and the MOSS Spectrum KSampler. Needs the moss-image node."
version = "0.6.1"
license = { file = "LICENSE" }
# torch / numpy / pillow ship with any ComfyUI install; listed for a bare `pip install .`.
dependencies = [
    "torch",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# The layout node only; the i2i nodes load without it.
layout = ["anime-tools @ git+https://github.com/sorryhyun/anime_tools"]

[project.urls]
Repository = "https://github.com/sorryhyun/ComfyUI-MOSS-Toolkit"

[tool.comfy]
PublisherId = "sorryhyun"
DisplayName = "MOSS Toolkit"
Icon = ""
